# ===== BASIC SETTINGS =====
set -g prefix C-a
unbind C-b

set-option -g default-command "/bin/zsh -l"
set-option -sa terminal-overrides "xterm*:Tc"

# ===== PANE MANAGEMENT =====
bind '|' split-window -h
bind '-' split-window -v
unbind '"'
unbind '%'

# Pane resizing with prefix + arrow keys
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5

# ===== RELOAD CONFIG =====
bind r source-file ~/.tmux.conf

# ===== PANE NAVIGATION =====
# Unbind Ctrl keys to let Neovim handle them
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

# Use Alt keys for tmux pane navigation
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-j select-pane -D
bind -n M-k select-pane -U

# ===== WINDOW OPTIONS =====
set-option -g allow-rename off
# shift + alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# ===== SESSION NAVIGATION =====
# alt + number to switch sessions (Nth in creation order, matches prefix+s listing)
bind -n M-1 run-shell '~/.config/nvim/tmux/session-switch.sh 1'
bind -n M-2 run-shell '~/.config/nvim/tmux/session-switch.sh 2'
bind -n M-3 run-shell '~/.config/nvim/tmux/session-switch.sh 3'
bind -n M-4 run-shell '~/.config/nvim/tmux/session-switch.sh 4'
bind -n M-5 run-shell '~/.config/nvim/tmux/session-switch.sh 5'
bind -n M-6 run-shell '~/.config/nvim/tmux/session-switch.sh 6'
bind -n M-7 run-shell '~/.config/nvim/tmux/session-switch.sh 7'
bind -n M-8 run-shell '~/.config/nvim/tmux/session-switch.sh 8'
bind -n M-9 run-shell '~/.config/nvim/tmux/session-switch.sh 9'

# ===== COPY MODE =====
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection

# ===== PLUGINS =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'Nybkox/tmux-kanagawa'

# ===== THEMES =====
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-ignore-window-colors true
# ===== BELL SETTINGS =====
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action any
setw -g window-status-bell-style 'fg=black bg=red bold'

# ===== STYLING =====
# Copy mode
setw -g mode-style 'fg=black bg=red bold'

# Pane borders
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# Message styling
set -g message-style 'fg=orange bg=black bold'

# Clock
setw -g clock-mode-colour yellow

# Assume allow-passthrough
set -g allow-passthrough on
set -g assume-paste-time 1
